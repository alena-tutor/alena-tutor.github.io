<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-alt: #F7F6F4;
      --card: #FFFFFF;
      --accent: #FF7A3D;
      --accent-soft: #FFE4D3;
      --teal: #2E8C82;
      --teal-soft: #DCEFEC;
      --text: #1C2528;
      --muted: #6E7E81;
      --border: #E2EAEA;
      --danger: #E0524A;
      --danger-soft: #FBDAD7;
      --success: #2E8C72;
      --success-soft: #DCF1E6;
      --surface: #F7F6F4;
      --radius: 16px;
      --shadow: 0 10px 26px rgba(28, 37, 40, 0.07);
      --font-display: "Manrope", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      box-shadow: 8px 0 28px rgba(28, 37, 40, 0.06);
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
    }

    .sidebar-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FF8F5C, #FF7A3D);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 16px rgba(255, 122, 61, 0.35);
    }

    .sidebar-logo-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-logo-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .sidebar-logo-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .sidebar-section-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 4px 4px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-btn {
      border-radius: 999px;
      border: none;
      padding: 10px 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.08s ease;
    }

    .nav-btn span.icon {
      font-size: 16px;
      width: 22px;
      text-align: center;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      box-shadow: 0 5px 12px rgba(28, 37, 40, 0.10);
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #FF8F5C, #FF7A3D);
      color: #fff;
      box-shadow: 0 8px 18px rgba(255, 122, 61, 0.35);
    }

    .nav-btn.active span.icon {
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--muted);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
    }

    /* MAIN PANEL */

    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-date-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #todayLabel {
      font-size: 15px;
      font-weight: 600;
    }

    .header-timezone {
      font-size: 11px;
      color: var(--muted);
    }

    .header-timezone select {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #FFFFFF;
    }

    .header-right {
      font-size: 11px;
      color: var(--muted);
    }

    /* CLOCK */

    .clock {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--accent-soft);
      position: relative;
      background: var(--card);
      box-shadow:
        0 2px 6px rgba(0,0,0,0.06) inset,
        0 6px 14px rgba(28, 37, 40, 0.10);
    }

    .clock-center {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .clock-hand {
      position: absolute;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 999px;
    }

    .clock-hand.hour {
      width: 3px;
      height: 22px;
      bottom: 50%;
      background: var(--accent);
      z-index: 2;
    }

    .clock-hand.min {
      width: 2px;
      height: 28px;
      bottom: 50%;
      background: var(--text);
      z-index: 2;
    }

    .clock-hand.sec {
      width: 1px;
      height: 30px;
      bottom: 50%;
      background: var(--danger);
      z-index: 1;
    }

    .clock-num {
      position: absolute;
      font-size: 9px;
      color: var(--muted);
      transform: translate(-50%, -50%);
    }

    .clock-num.n12 { top: 8px; left: 50%; }
    .clock-num.n3 { top: 50%; right: 8px; transform: translate(50%, -50%); }
    .clock-num.n6 { bottom: 8px; left: 50%; }
    .clock-num.n9 { top: 50%; left: 8px; transform: translate(-50%, -50%); }

    /* CONTENT */

    main {
      flex: 1;
      padding: 16px 22px 22px;
      background: var(--bg);
    }

    #mainCol {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
    }

    .card.accent-orange { border-left-color: var(--accent); }
    .card.accent-teal { border-left-color: var(--teal); }
    .card.accent-quiet { border-left-color: var(--border); }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
      display: block;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .status-dot.done { background: var(--success); }
    .status-dot.scheduled { background: var(--accent); }
    .status-dot.cancelled { background: var(--danger); }
    .status-dot.muted { background: var(--muted); opacity: 0.4; }

    .status-row {
      display: flex;
      align-items: center;
      font-size: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 122, 61, 0.25);
    }

    .tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
    }

    .empty-state {
      font-size: 12px;
      color: var(--muted);
      padding: 4px;
    }

    .btn-main {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      background: linear-gradient(135deg, #FF8F5C, #FF7A3D);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(255, 122, 61, 0.35);
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .btn-main:hover {
      box-shadow: 0 10px 22px rgba(255, 122, 61, 0.45);
      transform: translateY(-1px);
    }

    .btn-secondary {
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.1s ease, transform 0.08s ease;
    }

    .btn-secondary:hover {
      background: #ECECEC;
      transform: translateY(-1px);
    }

    .btn-danger {
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--danger-soft);
      border: 1px solid #F0BDB8;
      color: var(--danger);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .btn-chip {
      border-radius: 999px;
      border: none;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
    }

    .btn-chip.primary {
      background: linear-gradient(135deg, #FF8F5C, #FF7A3D);
      color: #fff;
    }

    .btn-chip.teal {
      background: var(--accent-soft);
      color: #C75A28;
    }

    .btn-chip.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-chip.small {
      font-size: 10px;
      padding: 2px 7px;
    }

    .tiny {
      font-size: 11px;
      color: var(--muted);
    }

    /* HOME LAYOUT */

    .day-hero {
      background: linear-gradient(135deg, #FFF6F0 0%, #FFFFFF 60%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .day-hero-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: capitalize;
    }

    .day-hero-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .day-timeline {
      position: relative;
      flex: 1;
      min-width: 220px;
      height: 36px;
      margin-top: 4px;
    }

    .day-timeline-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
    }

    .day-timeline-dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid var(--card);
      cursor: pointer;
    }

    .day-timeline-dot.done { background: var(--success); }
    .day-timeline-dot.scheduled { background: var(--accent); }
    .day-timeline-dot.cancelled { background: var(--muted); opacity: 0.5; }

    .day-timeline-label {
      position: absolute;
      top: 100%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      margin-top: 2px;
    }

    .home-grid {
      display: grid;
      grid-template-columns: 2.1fr 1.1fr;
      gap: 14px;
      align-items: flex-start;
    }

    .home-left {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .home-right {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .notes-area {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 8px;
      font-size: 13px;
      background: #FFFFFF;
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .lesson-card {
      padding: 9px 9px;
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid var(--border);
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.12s ease;
    }

    .lesson-card:hover {
      background: #FFEDE2;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(28, 37, 40, 0.10);
    }

    .lesson-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .lesson-name {
      font-family: var(--font-display);
      font-weight: 700;
    }

    .lesson-time {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .lesson-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .lesson-grades {
      font-size: 11px;
      display: flex;
      gap: 10px;
      color: var(--muted);
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .summary-number {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 4px;
      color: var(--muted);
    }

    /* PERFORMANCE */

    .perf-row {
      display: grid;
      grid-template-columns: 1.4fr 0.6fr 1.5fr;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .perf-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--teal-soft);
      overflow: hidden;
    }

    .perf-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #FF8F5C, #FF7A3D);
      width: 0%;
    }

    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }

    .topics-item {
      padding: 5px 7px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    /* CALENDAR */

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .calendar-day {
      border-radius: 14px;
      background: var(--surface);
      padding: 6px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      border: 1px solid var(--border);
      transition: box-shadow 0.12s ease, transform 0.08s ease;
    }

    .calendar-day.is-today {
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
    }

    .calendar-day.is-today .calendar-day-header span:first-child {
      color: var(--accent);
      font-weight: 700;
    }

    .calendar-day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }

    .calendar-lessons {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .calendar-mini {
      background: var(--card);
      border-radius: 9px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      cursor: grab;
      border: 1px solid var(--border);
    }

    .calendar-mini.done {
      border-color: #9FD9BE;
      background: var(--success-soft);
    }

    .calendar-mini.cancelled {
      border-color: #F0BDB8;
      opacity: 0.6;
    }

    .calendar-mini.group {
      border-color: var(--teal);
      background: var(--teal-soft);
      cursor: pointer;
    }

    .calendar-mini .line1 {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }

    .calendar-mini .line2 {
      font-size: 10px;
      color: var(--muted);
    }

    .calendar-day.drop-target {
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(255, 122, 61, 0.30);
    }

    .calendar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    /* FORMS */

    .form-section {
      border-radius: var(--radius);
      background: var(--card);
      padding: 16px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(28, 37, 40, 0.04);
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row-inline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row-inline > div {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .form-input, .form-select, textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: 13px;
      background: #FFFFFF;
      color: var(--text);
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .form-input:focus, .form-select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    /* STUDENTS & SUBSCRIPTIONS */

    .students-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .student-card {
      border-radius: 14px;
      background: var(--surface);
      padding: 7px 9px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border: 1px solid var(--border);
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.12s ease;
    }

    .student-card:hover {
      background: #FFEDE2;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(28, 37, 40, 0.10);
    }

    .student-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
    }

    .student-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
    }

    .subs-table-header,
    .subs-table-row {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1.2fr 1.2fr 1.6fr;
      column-gap: 6px;
      align-items: center;
    }

    .subs-table-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .subs-table-row {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(0,0,0,0.03);
    }

    .subs-table-row:nth-child(odd) {
      background: rgba(255,255,255,0.3);
    }

  const STORAGE_KEY = "teacherAppData";

    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
      return JSON.parse(JSON.stringify(defaultData));
    }
    try {
      const parsed = JSON.parse(raw);
      if (!parsed.tutorTZ) parsed.tutorTZ = defaultData.tutorTZ;
      if (!parsed.students) parsed.students = [];
      if (!parsed.lessons) parsed.lessons = [];
      if (!parsed.subscriptions) parsed.subscriptions = [];
      if (!parsed.weekNotes) parsed.weekNotes = "";
      if (!parsed.completedTasks) parsed.completedTasks = [];
      if (!parsed.coursePlans) parsed.coursePlans = [];
      if (!parsed.groups) parsed.groups = [];
      if (!parsed.groupLessons) parsed.groupLessons = [];

      parsed.students.forEach(s => {
        if (!("parentName" in s)) s.parentName = "";
        if (!("parentContact" in s)) s.parentContact = "";
        if (!("parentContactType" in s)) s.parentContactType = "phone";
        if (!("paymentMode" in s)) s.paymentMode = "subscription"; // "subscription" | "perLesson"
      });

      parsed.subscriptions.forEach(s => {
        if (s.paid === undefined || s.paid === null) {
          s.paid = s.price || 0;
        }
        if (s.doneOffset === undefined || s.doneOffset === null) {
          s.doneOffset = 0;
        }
      });

      parsed.lessons.forEach(l => {
        if (!("paidAmount" in l)) l.paidAmount = null; // used when student.paymentMode === "perLesson"
      });

      if (!Array.isArray(parsed.coursePlans)) parsed.coursePlans = [];
      if (!Array.isArray(parsed.groups)) parsed.groups = [];
      if (!Array.isArray(parsed.groupLessons)) parsed.groupLessons = [];

      return parsed;
    } catch(e) {
      console.error(e);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
      return JSON.parse(JSON.stringify(defaultData));
    }
  }

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function parseISO(dateStr) {
    const [y,m,d] = dateStr.split("-").map(Number);
    return new Date(y,m-1,d);
  }

  function dateToISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  const MONTHS_RU = ["января","февраля","марта","апреля","мая","июня",
    "июля","августа","сентября","октября","ноября","декабря"];

  function pluralizeChildren(n){
    const mod10 = n%10, mod100 = n%100;
    let word;
    if (mod100>=11 && mod100<=14) word="детей";
    else if (mod10===1) word="ребёнок";
    else if (mod10>=2 && mod10<=4) word="ребёнка";
    else word="детей";
    return `${n} ${word}`;
  }

  function formatBirthdayShort(birthday){
    if(!birthday) return "";
    const [,m,d] = birthday.split("-").map(Number);
    return `${d} ${MONTHS_RU[m-1]}`;
  }

  function daysUntilBirthday(birthday){
    if(!birthday) return null;
    const [,bm,bd] = birthday.split("-").map(Number);
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let next = new Date(now.getFullYear(), bm-1, bd);
    if (next < todayStart) next = new Date(now.getFullYear()+1, bm-1, bd);
    return Math.round((next - todayStart) / 86400000);
  }

  function getUpcomingBirthdays(withinDays=3){
    return data.students
      .filter(s=>s.birthday)
      .map(s=>({student:s, daysUntil:daysUntilBirthday(s.birthday)}))
      .filter(x=>x.daysUntil!==null && x.daysUntil>=0 && x.daysUntil<=withinDays)
      .sort((a,b)=>a.daysUntil-b.daysUntil);
  }

  function getStudent(id) {
    return data.students.find(s => s.id === id) || null;
  }

  function getGroup(id) {
    return data.groups.find(g => g.id === id) || null;
  }

  function getGroupMembers(groupId) {
    const g = getGroup(groupId);
    if (!g) return [];
    return g.memberIds.map(id=>getStudent(id)).filter(Boolean);
  }

  function getGroupForStudent(studentId) {
    return data.groups.find(g => g.memberIds.includes(studentId)) || null;
  }

  function getIndividualLessons(extraFilterFn) {
    // Returns lessons for students who are NOT in a group (avoids duplicating
    // a child's schedule once they belong to a group with its own groupLessons).
    return data.lessons.filter(l => {
      if (getGroupForStudent(l.studentId)) return false;
      return extraFilterFn ? extraFilterFn(l) : true;
    });
  }

  function createGroupLesson(groupId, date, time) {
    const g = getGroup(groupId);
    if (!g) return null;
    const exists = data.groupLessons.find(gl=>gl.groupId===groupId && gl.date===date && gl.time===time);
    if (exists) return exists;
    const id = data.groupLessons.length ? Math.max(...data.groupLessons.map(l=>l.id))+1 : 1;
    const lesson = {
      id, groupId, date, time,
      topic: "",
      attendance: g.memberIds.map(studentId=>({studentId, present:null, comment:""}))
    };
    data.groupLessons.push(lesson);
    return lesson;
  }

  function autoCreateLessonsForGroup(group, weeks, startDate) {
    if (!group.schedule || !group.schedule.length) return;
    const base = startDate ? new Date(startDate) : new Date();
    base.setHours(0,0,0,0);
    const msWeek = 7*24*60*60*1000;

    group.schedule.forEach(slot => {
      if (!slot.time) return;
      const dow = daysOfWeek.find(d=>d.key===slot.dayKey)?.dow;
      if (dow == null) return;

      const first = new Date(base);
      let diff = (dow - first.getDay() + 7) % 7;
      first.setDate(first.getDate()+diff);

      for(let w=0; w<weeks; w++){
        const d = new Date(first.getTime() + w*msWeek);
        createGroupLesson(group.id, dateToISO(d), slot.time);
      }
    });
  }

  function syncGroupLessonsAttendance(groupId) {
    // Ensure every group lesson's attendance array matches current member list
    const g = getGroup(groupId);
    if (!g) return;
    data.groupLessons.filter(gl=>gl.groupId===groupId).forEach(gl=>{
      const existingIds = gl.attendance.map(a=>a.studentId);
      g.memberIds.forEach(sid=>{
        if (!existingIds.includes(sid)) {
          gl.attendance.push({studentId:sid, present:null, comment:""});
        }
      });
      gl.attendance = gl.attendance.filter(a=>g.memberIds.includes(a.studentId));
    });
  }

  function repairGroupMembersStaleSchedules() {
    // For every student currently in a group, clear their individual schedule
    // and remove their future (not-yet-happened) individual lessons.
    // Past/done/cancelled lessons are preserved as history.
    const today = todayISO();
    let studentsFixed = 0;
    let lessonsRemoved = 0;

    data.students.forEach(st=>{
      const grp = getGroupForStudent(st.id);
      if (!grp) return;

      const hadSchedule = !!(st.schedule && st.schedule.length);
      const futureLessons = data.lessons.filter(l =>
        l.studentId===st.id && l.status==="scheduled" && l.date>=today
      );

      if (hadSchedule || futureLessons.length) {
        if (hadSchedule) { st.schedule = null; studentsFixed++; }
        if (futureLessons.length) {
          lessonsRemoved += futureLessons.length;
          data.lessons = data.lessons.filter(l =>
            !(l.studentId===st.id && l.status==="scheduled" && l.date>=today)
          );
        }
      }
    });

    return {studentsFixed, lessonsRemoved};
  }

  function getLessonsByStudent(id) {
    return data.lessons.filter(l => l.studentId === id);
  }

  function getSubscription(studentId) {
    return data.subscriptions.find(s => s.studentId === studentId) || null;

  function getMonthlyIncomeStats(yearMonth){
    const ym = yearMonth || todayISO().slice(0,7);
    let subscriptionIncome=0, perLessonIncome=0;

    // For subscription students: count payments whose nextPaymentDate-ish... simplify:
    // we approximate subscription income as "paid" amounts recorded on subscriptions
    // updated/created within this month is not tracked, so we instead sum done-lesson value
    // proportionally is overkill — show subscription "paid" totals for active subs as a simple figure,
    // and per-lesson income computed precisely from paidAmount in this month.
    data.students.forEach(st=>{
      if (st.paymentMode==="perLesson"){
        const stats=getPerLessonStats(st.id, ym);
        perLessonIncome += stats.totalPaid;
      }
    });

    data.subscriptions.forEach(sub=>{
      const st=getStudent(sub.studentId);
      if (st && st.paymentMode!=="perLesson"){
        subscriptionIncome += (sub.paid||0);
      }
    });

    return {ym, subscriptionIncome, perLessonIncome, total: subscriptionIncome+perLessonIncome};
  }

  function createLesson(studentId,date,time) {
    const id = data.lessons.length ? Math.max(...data.lessons.map(l=>l.id))+1 : 1;
    const existing = data.lessons.find(l => l.studentId===studentId && l.date===date && l.time===time && l.status!=="cancelled");
    if (existing) return existing;
    const lesson = {
      id,
      studentId,
      date,
      time,
      status: "scheduled",
      topic: "",
      hw: "",
      gradeLesson: null,
      gradeHW: null,
      comment: "",
      commentLesson: "",
      commentHW: "",
      wasMoved: false
    };
    data.lessons.push(lesson);
    return lesson;
  }

  function autoCreateLessonsForStudent(student,weeks,startDate) {
    if (!student.schedule || !student.schedule.length) return;
    const base = startDate ? new Date(startDate) : new Date();
    base.setHours(0,0,0,0);
    const msWeek = 7*24*60*60*1000;

    student.schedule.forEach(slot => {
      if (!slot.time) return;
      const dow = daysOfWeek.find(d=>d.key===slot.dayKey)?.dow;
      if (dow == null) return;

      const first = new Date(base);
      let diff = (dow - first.getDay() + 7) % 7;
      first.setDate(first.getDate()+diff);

      for(let w=0; w<weeks; w++){
        const d = new Date(first.getTime() + w*msWeek);
        createLesson(student.id, dateToISO(d), slot.time);
      }
    });
  }

  function updateScheduleForStudent(studentId, newSchedule) {
    const student = getStudent(studentId);
    if (!student) return;

    const today = todayISO();
    // Determine how far ahead lessons were generated, based on existing future scheduled lessons
    const futureScheduled = data.lessons.filter(l =>
      l.studentId===studentId && l.status==="scheduled" && l.date>=today
    );
    let weeksAhead = 4;
    if (futureScheduled.length) {
      const maxDate = futureScheduled.reduce((max,l)=> l.date>max ? l.date : max, today);
      const diffDays = Math.round((new Date(maxDate) - new Date(today)) / 86400000);
      weeksAhead = Math.max(1, Math.ceil(diffDays/7) + 1);
    }

    // Remove future scheduled lessons (keep past/done/cancelled lessons untouched)
    data.lessons = data.lessons.filter(l =>
      !(l.studentId===studentId && l.status==="scheduled" && l.date>=today)
    );

    student.schedule = newSchedule.length ? newSchedule : null;

    if (student.schedule) {
      autoCreateLessonsForStudent(student, weeksAhead, today);
    }
  }

  function extendScheduleForStudent(studentId,weeks) {
    const student = getStudent(studentId);
    if (!student) { alert("Ученик не найден"); return; }
    if (!student.schedule || !student.schedule.length) {
      alert("Для ученика не задано расписание.");
      return;
    }
    const lessons = getLessonsByStudent(studentId);
    let start;
    if (lessons.length) {
      const maxDateStr = lessons.reduce((max,l)=> !max || l.date>max ? l.date : max, "");
      const d = parseISO(maxDateStr);
      d.setDate(d.getDate()+1);
      start = d;
    } else {
      start = new Date();
    }
    autoCreateLessonsForStudent(student,weeks,start);
    save();
  }

  /* Вспомогательные: критичные абонементы, темы, чек-лист */

  function computeCriticalSubscriptions() {
    const result=[];
    data.students.forEach(st=>{
      const stats = getSubscriptionStats(st.id);
      const {sub,remaining,debt} = stats;
      if(!sub) return;
      if(remaining<=2 || debt>0){
        result.push({student:st, stats});
      }
    });
    result.sort((a,b)=>{
      const debtA = a.stats.debt || 0;
      const debtB = b.stats.debt || 0;
      if (debtA !== debtB) return debtB - debtA;
      return (a.stats.remaining || 0) - (b.stats.remaining || 0);
    });
    return result;
  }

  function getRecentTopics(limit=8) {
    const lessons = data.lessons
      .filter(l=>l.topic && l.topic.trim())
      .sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    const seen = new Set();
    const result=[];
    for(const l of lessons){
      const t = l.topic.trim();
      if(!seen.has(t)){
        seen.add(t);
        result.push(t);
        if(result.length>=limit) break;
      }
    }
    return result;
  }

  function buildTodayTasks(todays) {
    const tasks=[];
    todays.forEach(l=>{
      const st=getStudent(l.studentId);
      const name = st ? st.name : "—";
      const labelBase = `${name} (${l.time})`;

      const idRem = `reminder|${l.id}`;
      tasks.push({
        id:idRem,
        text:`Напомнить о занятии: ${labelBase}`,
        action:()=>sendLessonReminder(l,st)
      });

      if(l.hw && l.hw.trim()){
        const idHW=`homework|${l.id}`;
        tasks.push({
          id:idHW,
          text:`Отправить домашнее задание: ${name}`,
          action:()=>sendHomework(l,st)
        });
      }

      if(l.gradeLesson==null || l.gradeHW==null){
        const idGr=`grade|${l.id}`;
        tasks.push({
          id:idGr,
          text:`Поставить оценку: ${name}`,
          action:()=>openLessonView(l.id)
        });
      }
    });

    computeCriticalSubscriptions().forEach(({student,stats})=>{
      const idSub=`subNotify|${student.id}`;
      const base = stats.remaining<=0
        ? "Оповестить об окончании абонемента"
        : "Оповестить о скором окончании абонемента";
      tasks.push({
        id:idSub,
        text:`${base}: ${student.name}`,
        action:()=>notifySubscription(student,stats)
      });
    });

    return tasks;
  }

  function renderCalendar(main){
    const card=document.createElement("section");
    card.className="card accent-teal";

    const header=document.createElement("div");
    header.className="card-header";
    const left=document.createElement("div");
    const eyebrow=document.createElement("span");

    const subtitle=document.createElement("div");
    subtitle.className="card-subtitle";
    subtitle.textContent="Перетаскивай уроки для переноса. Клик по уроку — карточка.";
    left.appendChild(eyebrow);
    left.appendChild(title);
    left.appendChild(subtitle);

    const controls=document.createElement("div");
    controls.className="calendar-controls";
    const btnPrev=document.createElement("button");
    btnPrev.className="btn-secondary";
    btnPrev.textContent="◀";
    btnPrev.onclick=()=>{currentMonthDate.setMonth(currentMonthDate.getMonth()-1);render();};
    const btnNext=document.createElement("button");
    btnNext.className="btn-secondary";
    btnNext.textContent="▶";
    btnNext.onclick=()=>{currentMonthDate.setMonth(currentMonthDate.getMonth()+1);render();};
    const label=document.createElement("span");
    label.textContent=currentMonthDate.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
    controls.appendChild(btnPrev);
    controls.appendChild(label);
    controls.appendChild(btnNext);

    header.appendChild(left);
    header.appendChild(controls);
    card.appendChild(header);

    const grid=document.createElement("div");
    grid.className="calendar-grid";

    const first = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth(),1);
    const startDay = (first.getDay()+6)%7;
    let d = new Date(first);
    d.setDate(d.getDate()-startDay);

    for(let i=0;i<35;i++){
      const iso=dateToISO(d);
      const col=document.createElement("div");
      col.className="calendar-day";
      if (iso===todayISO()) col.classList.add("is-today");
      col.dataset.date=iso;

      col.addEventListener("dragover",e=>{
        e.preventDefault();
        col.classList.add("drop-target");
      });
      col.addEventListener("dragleave",()=>col.classList.remove("drop-target"));
      col.addEventListener("drop",e=>{
        e.preventDefault();
        col.classList.remove("drop-target");
        const idStr=e.dataTransfer.getData("text/plain");
        if (idStr.startsWith("group:")) {
          const glId=parseInt(idStr.slice(6),10);
          if(!glId) return;
          moveGroupLessonDate(glId,iso);
        } else {
          const id=parseInt(idStr,10);
          if(!id) return;
          moveLessonDate(id,iso);
        }
      });

      const head=document.createElement("div");
      head.className="calendar-day-header";
      const dayNum=document.createElement("span");
      dayNum.textContent=d.getDate();
      const dMonth=d.getMonth()+1, dDay=d.getDate();
      const hasBirthday = data.students.some(s=>{
        if(!s.birthday) return false;
        const [,bm,bd]=s.birthday.split("-").map(Number);
        return bm===dMonth && bd===dDay;
      });
      if (hasBirthday) dayNum.textContent += " 🎂";
      const short=document.createElement("span");
      short.className="tiny";
      short.textContent=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"][(d.getDay()+6)%7];
      head.appendChild(dayNum);
      head.appendChild(short);
      col.appendChild(head);

      const list=document.createElement("div");
      list.className="calendar-lessons";
      const lessons=data.lessons
        .filter(l=>l.date===iso && l.status!=="cancelled" && !getGroupForStudent(l.studentId))
        .sort((a,b)=>a.time.localeCompare(b.time));
      const grpLessons=data.groupLessons
        .filter(gl=>gl.date===iso)
        .sort((a,b)=>a.time.localeCompare(b.time));

      if (!lessons.length && !grpLessons.length){
        const tiny=document.createElement("div");
        tiny.className="tiny";
        tiny.textContent="—";
        list.appendChild(tiny);
      } else {
        grpLessons.forEach(gl=>{
          const grp=getGroup(gl.groupId);
          const mini=document.createElement("div");
          mini.className="calendar-mini group";
          mini.draggable=true;
          mini.addEventListener("dragstart",e=>{
            e.dataTransfer.setData("text/plain","group:"+String(gl.id));
          });
          mini.onclick=()=>{currentView="groupLessonDetail";currentGroupLessonId=gl.id;render();};

          const line1=document.createElement("div");
          line1.className="line1";
          const tSpan=document.createElement("span");
          tSpan.textContent=gl.time;
          const nSpan=document.createElement("span");
          nSpan.textContent="👪 "+(grp?grp.name:"Группа");
          line1.appendChild(tSpan);
          line1.appendChild(nSpan);

          const line2=document.createElement("div");
          line2.className="line2";
          line2.textContent=gl.topic || pluralizeChildren(gl.attendance.length);

          mini.appendChild(line1);
          mini.appendChild(line2);
          list.appendChild(mini);
        });

        lessons.forEach(l=>{
          const st=getStudent(l.studentId);
          const mini=document.createElement("div");
          mini.className="calendar-mini";
          if(l.status==="done") mini.classList.add("done");
          if(l.status==="cancelled") mini.classList.add("cancelled");
          mini.draggable=true;
          mini.addEventListener("dragstart",e=>{
            e.dataTransfer.setData("text/plain",String(l.id));
          });
          mini.onclick=()=>openLessonView(l.id);

          const line1=document.createElement("div");
          line1.className="line1";
          const tSpan=document.createElement("span");
          tSpan.textContent=l.time;
          const nSpan=document.createElement("span");
          nSpan.textContent=st?st.name:"—";
          line1.appendChild(tSpan);
          line1.appendChild(nSpan);

          const line2=document.createElement("div");
          line2.className="line2";
          line2.textContent=l.topic || "";

          mini.appendChild(line1);
          mini.appendChild(line2);
          list.appendChild(mini);
        });
      }

      col.appendChild(list);

      const addBtn=document.createElement("button");
      addBtn.className="btn-chip small";
      addBtn.textContent="+ урок";
      addBtn.onclick=()=>openAddLessonForDate(iso);
      col.appendChild(addBtn);

      grid.appendChild(col);
      d.setDate(d.getDate()+1);
    }

    card.appendChild(grid);
    main.appendChild(card);
  }

  function moveLessonDate(lessonId,newDate){
    const l=data.lessons.find(x=>x.id===lessonId);

    l.date=newDate;
    l.wasMoved=true;
    save();
  }

  function moveGroupLessonDate(groupLessonId,newDate){
    const gl=data.groupLessons.find(x=>x.id===groupLessonId);
    if(!gl) return;
    gl.date=newDate;
    save();
  }

  function openAddLessonForDate(dateStr){
    const name = prompt("Имя ученика (как в списке)", "");
    if(!name) return;
    const student = data.students.find(s=>s.name.trim()===name.trim());
    if(!student){alert("Ученик не найден.");return;}
    const time=prompt("Время (ЧЧ:ММ)", "18:00");
    if(!time) return;
    createLesson(student.id,dateStr,time);
    save();
  }

  function getAllCommentsForStudentInGroup(studentId){
    const entries = [];
    data.groupLessons.forEach(gl=>{
      const att = gl.attendance.find(a=>a.studentId===studentId);
      if (att && att.comment && att.comment.trim()){
        entries.push({date:gl.date, present:att.present, comment:att.comment.trim()});
      }
    });
    entries.sort((a,b)=> a.date>b.date?1:-1);
    return entries;
  }

  function buildMonthlyCommentText(studentId, studentName){
    const entries = getAllCommentsForStudentInGroup(studentId);
    if (!entries.length) return `Комментариев по ученику ${studentName} пока нет.`;
    let text = `Комментарии по занятиям — ${studentName}\n\n`;
    entries.forEach(e=>{
      const statusLabel = e.present===true ? "был" : e.present===false ? "не был" : "статус не указан";
      text += `${e.date} (${statusLabel}): ${e.comment}\n`;
    });
    return text;
  }

        }
      });

        }
      }

      save();
      currentView="student";
      render();

  /* MESSENGERS: напоминания и домашка */

  function sendLessonReminder(lesson,student){
    if(!student){alert("Ученик не найден");return;}
    const text=`Напоминание 🌿\nСегодня занятие в ${lesson.time}.\nТема: ${lesson.topic||"(уточним на уроке)"}`;
    openMessenger(student,text);
  }

  function sendHomework(lesson,student){
    if(!student){alert("Ученик не найден");return;}
    const text=`Домашнее задание 📚\n${lesson.hw||"Скоро пришлю задание."}`;
    openMessenger(student,text);
  }

  function notifySubscription(student, stats){
    const {remaining,total,price,paid,doneCount} = stats;
    let text;
    if(total>0 && remaining<=0){
      text =
        `Добрый день! У ${student.name} закончился абонемент `+
        `(${total} занятий, проведено ${doneCount}). `+
        `Пожалуйста, обновите оплату. Стоимость: ${price} ₽, оплачено: ${paid} ₽.`;
    } else if(total>0 && remaining<=2){
      text =
        `Добрый день! У ${student.name} скоро заканчивается абонемент. `+
        `Осталось ${remaining} занятий из ${total}.`;
    } else {
      text =
        `Информация по абонементу ${student.name}: проведено ${doneCount} из ${total} занятий.`;
    }
    openParentMessenger(student,text);
  }

  function openMessenger(student,text){
    if(!student.contact){
      alert("У ученика не указан контакт.");
      return;
    }
    openMessengerBy(student.contactType || "phone", student.contact, text);
  }

  function openParentMessenger(student,text){
    let type = student.parentContactType || "phone";
    let contact = (student.parentContact || "").trim();
    if(!contact){
      type = student.contactType || "phone";
      contact = (student.contact || "").trim();
    }
    if(!contact){
      alert("Не указан контакт родителя или ученика.");
      return;
    }
    openMessengerBy(type, contact, text);
  }

  function openMessengerBy(type, contact, text){
    const c = (contact || "").trim();
    if(!c){
      alert("Контакт не указан.");
      return;
    }
    const msg = encodeURIComponent(text);
    if(type==="whatsapp"){
      const phone=c.replace(/^\+/,"");
      window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
    } else if(type==="telegram"){
      const uname=c.startsWith("@")?c.substring(1):c;
      window.open(`https://t.me/${uname}?text=${msg}`,"_blank");
    } else {
      alert("Тип контакта — просто телефон. Можно вручную отправить сообщение:\n\n"+text);
    }
  }

    bTitle.className="card-title";
    bTitle.style.fontSize="13px";
    bTitle.textContent="Резервное копирование (экспорт / импорт)";
    const bText=document.createElement("div");
    bText.className="tiny";
    bText.innerHTML =
      "Экспорт создаёт текст с данными (ученики, уроки, абонементы, КТП). " +
      "Сохрани этот текст в файл/заметки. При импорте вставь его обратно и нажми «Импортировать».";

    const bRow=document.createElement("div");
    bRow.className="form-row";
    const bLbl=document.createElement("div");
    bLbl.className="form-label";
    bLbl.textContent="Текст резервной копии (JSON)";
    const backupArea=document.createElement("textarea");
    backupArea.placeholder = "Нажми «Экспортировать данные» — здесь появится текст.\n" +
                              "Скопируй его и сохрани. Чтобы восстановить — вставь сюда сохранённый текст и нажми «Импортировать данные».";
    bRow.appendChild(bLbl);
    bRow.appendChild(backupArea);

    const bActions=document.createElement("div");
    bActions.className="form-actions";
    const btnExport=document.createElement("button");
    btnExport.className="btn-secondary";
    btnExport.textContent="Экспортировать данные в текст ниже";
    btnExport.onclick=()=>{
      try{
        const json = JSON.stringify(data,null,2);
        backupArea.value = json;
        backupArea.focus();
        backupArea.select();
        alert("Данные выгружены. Скопируй текст и сохрани его в безопасном месте.");
      }catch(e){
        console.error(e);
        alert("Не удалось экспортировать данные.");
      }
    };

    const btnImport=document.createElement("button");
    btnImport.className="btn-main";
    btnImport.textContent="Импортировать данные из текста";
    btnImport.onclick=()=>{
      const text = backupArea.value.trim();
      if(!text){
        alert("Вставь сюда текст резервной копии.");
        return;
      }
      if(!confirm("Текущие данные будут заменены данными из текста. Продолжить?")){
        return;
      }
      try{
        const parsed = JSON.parse(text);
        if(!parsed || typeof parsed!=="object" || !Array.isArray(parsed.students)){
          alert("Похоже, это не резервная копия этого кабинета (нет поля students).");
          return;
        }
        // Сохраняем сырые данные и заново инициализируем через loadData(),
        // чтобы добавить недостающие поля/структуру.
        localStorage.setItem(STORAGE_KEY, text);
        data = loadData();
        save();
        alert("Данные успешно импортированы.");
      }catch(e){
        console.error(e);
        alert("Ошибка при разборе JSON. Проверь, что текст не повреждён.");
      }
    };

    bActions.appendChild(btnExport);
    bActions.appendChild(btnImport);

    backup.appendChild(bTitle);
    backup.appendChild(bText);
    backup.appendChild(bRow);
    backup.appendChild(bActions);

    card.appendChild(backup);

    /* Блок: полный сброс */
    const danger=document.createElement("div");
    danger.className="form-section";
    danger.style.background="var(--danger-soft)";
    danger.style.borderColor="#F0BDB8";

    const dTitle=document.createElement("div");
    dTitle.className="card-title";
    dTitle.style.fontSize="13px";
    dTitle.textContent="Сбросить кабинет";
    const dText=document.createElement("div");
    dText.className="tiny";
    dText.textContent="Удалит всех учеников, уроки и абонементы. При подключённом облаке удаление синхронизируется. Сначала скачай резервную копию.";
    const btnReset=document.createElement("button");
    btnReset.className="btn-danger";
    btnReset.textContent="Удалить все данные";
    btnReset.onclick=()=>{
      if(confirm("Точно удалить ВСЕ данные (учеников, уроки, абонементы, КТП)?")) {
        localStorage.removeItem(STORAGE_KEY);
        data = loadData();
        save();
      }
    };

    danger.appendChild(dTitle);
    danger.appendChild(dText);
    danger.appendChild(btnReset);

    card.appendChild(danger);

    main.appendChild(card);
  }

function deskBillingLessons(studentId){
 const individual=getLessonsByStudent(studentId).map(l=>({key:'i:'+l.id,lesson:l,payment:l,group:false}));
 const group=data.groupLessons.flatMap(l=>{const a=(l.attendance||[]).find(a=>a.studentId===studentId);return a?[{key:'g:'+l.id,lesson:l,payment:a,group:true}]:[];});
 return [...individual,...group];
}
function getSubscriptionStats(studentId){
 const lessons=getLessonsByStudent(studentId),sub=getSubscription(studentId);
 const excluded=new Set(sub?.excludedLessonKeys||[]);
 const rawDone=deskBillingLessons(studentId).filter(x=>!excluded.has(x.key)&&(x.group?x.payment.present===true:x.lesson.status==='done')).length;
 const doneCount=Math.max(0,rawDone+(Number(sub?.doneOffset)||0)),total=Number(sub?.total)||0;
 const price=Number(sub?.price)||0,paid=Number(sub?.paid)||0;
 return {sub,lessons,rawDone,doneCount,total,remaining:Math.max(total-doneCount,0),price,paid,debt:Math.max(price-paid,0)};
}
function getPerLessonStats(studentId,yearMonth){
 const ym=yearMonth||todayISO().slice(0,7);const entries=deskBillingLessons(studentId).filter(x=>x.lesson.date.slice(0,7)===ym&&(x.group?x.payment.present===true:x.lesson.status==='done'));
 const totalPaid=entries.reduce((sum,x)=>sum+(Number(x.payment.paidAmount)||0),0);
 const rate=Number(getStudent(studentId)?.lessonPrice)||0;
 return {ym,lessons:entries.map(x=>x.lesson),entries,totalLessons:entries.length,totalPaid,unpaidCount:entries.filter(x=>!(Number(x.payment.paidAmount)>0)).length,totalDue:Math.max(entries.length*rate-totalPaid,0)};
}
function deleteStudent(id){

 if(!confirm(`Удалить ученика «${st.name}», его индивидуальные уроки и абонементы? Ученик также будет удалён из состава групп. Занятия остальных детей сохранятся.`))return;

 currentView='students';currentStudentId=null;save();
}

  sub.excludedLessonKeys=deskBillingLessons(studentId).filter(x=>x.group?x.payment.present!==null&&x.payment.present!==undefined:x.lesson.status==='done'||x.lesson.status==='cancelled').map(x=>x.key);
  sub.doneOffset=0;sub.total=Number(total.input.value);sub.price=Number(price.input.value);sub.paid=Number(paid.input.value);sub.startedAt=new Date().toISOString();st.paymentMode='subscription';deskProfileTab='payment';currentView='student';currentStudentId=studentId;save();

  document.querySelector('.sidebar-footer').before(status);
  const clone = value => JSON.parse(JSON.stringify(value));
  const snapshot = () => clone(data);
  const readCache = () => { try {return JSON.parse(localStorage.getItem(CACHE));} catch {return null;} };
  function paint(text) { message = text; status.textContent = (dirty ? '● ' : '☁ ') + text; }
  function cache() {
    if (user && ready) localStorage.setItem(CACHE, JSON.stringify({owner:user.id,revision,dirty,data:snapshot()}));
  }
  function backup() { localStorage.setItem(BACKUP, JSON.stringify({savedAt:new Date().toISOString(),data:snapshot()})); }
  function normalize(value) {
    if (!value || typeof value !== 'object' || !Array.isArray(value.students) || !Array.isArray(value.lessons))
      throw new Error('Облачная запись имеет неизвестный формат. Данные браузера сохранены.');
    for (const field of ['subscriptions','completedTasks','coursePlans','groups','groupLessons'])
      if (value[field] !== undefined && !Array.isArray(value[field])) throw new Error('Неверный формат: '+field);
    return {...clone(defaultData),...clone(value)};
  }
  function install(value) {
    data = normalize(value);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    data = loadData(); render();
  }
  async function getRow() {
    const {data:rows,error} = await client.from('teacher_desk_state').select('data,revision,updated_at').eq('owner_id',user.id);
    if (error) throw error;
    return rows?.[0] || null;
  }
  function readable(error) {
    if (error?.message === 'Invalid login credentials') return 'Проверь почту и пароль для входа на сайт.';
    if (error?.message === 'Email not confirmed') return 'Сначала подтверди почту.';
    return error?.message || 'Не удалось подключиться. Записи сохранены в браузере.';
  }
  async function connect(session) {
    if (busy) return;
    busy = true; ready = false; blocked = false; empty = false; status.title = '';
    user = session?.user || null;
    if (!user) { busy = false; paint('В этом браузере · войти'); return; }
    paint('Подключение…');
    try {
      const {data:access,error} = await client.from('teacher_desk_access').select('email');
      if (error) throw error;
      if (!access?.length) throw new Error('Для этой почты доступ ещё не разрешён. Напиши об этом в чат.');
      const before = JSON.stringify(data);
      const row = await getRow();
      if (before !== JSON.stringify(data)) throw new Error('Записи изменились во время подключения. Повтори подключение.');
      const pending = readCache();
      if (pending?.owner === user.id && pending.dirty) {
        normalize(pending.data);
        backup(); install(pending.data); revision = pending.revision;
        ready = true; dirty = true; empty = !row;
        if (Number(row?.revision || 0) !== revision) { blocked = true; paint('Нужна сверка записей'); }
        else { paint('Есть записи для отправки'); }
      } else if (row) {
        backup(); install(row.data); revision = Number(row.revision);
        ready = true; dirty = false; empty = false; cache(); paint('Облако · сохранено');
      } else {
        revision = 0; ready = false; dirty = false; empty = true;
        paint('Облако пустое · перенести');
      }
    } catch (error) {
      const pending = readCache();
      if (pending?.owner === user.id && /fetch|network|connection/i.test(error?.message || '')) {
        revision = Number(pending.revision); ready = true;
        dirty = pending.dirty || JSON.stringify(pending.data) !== JSON.stringify(data);
        cache(); paint('Без связи · записи в браузере');
      } else { ready = false; paint('Не подключено'); }
      status.title = readable(error); if(dialog) show(status.title);
    }
    finally { busy = false; }
    if (ready && dirty && !blocked) await flush();
  }
  function changed() {
    localGeneration++;
    if (!ready || !user) return;
    dirty = true; cache(); paint(blocked ? 'Нужна сверка записей' : 'Сохранено в браузере…');
    clearTimeout(timer); timer = setTimeout(flush, 600);
  }
  async function flush() {
    if (!ready || !user || !dirty || busy || blocked) return;
    busy = true;
    const sending = snapshot(), generation = localGeneration;
    paint('Отправка в облако…');
    try {
      const {data:rows,error} = await client.rpc('teacher_desk_save', {p_data:sending,p_revision:revision});
      if (error) throw error;
      if (!rows?.[0]) throw new Error('Сохранение не подтверждено сервером.');
      revision = Number(rows[0].revision); empty = false;
      dirty = localGeneration !== generation;
      cache(); paint(dirty ? 'Есть записи для отправки' : 'Облако · сохранено');
    } catch (error) {
      if (error?.code === '40001') {blocked = true; paint('Нужна сверка записей');}
      else { paint('Без связи · записи в браузере'); status.title = readable(error); }
      cache();
    } finally { busy = false; }
    if (dirty && !blocked && localGeneration !== generation) timer = setTimeout(flush,600);
  }
  async function poll(force = false) {
    if (!ready || !user || busy || blocked) return;
    if (dirty) { await flush(); return; }
    if (!force && (document.hidden || dialog || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.querySelector('.desk-dialog'))) return;
    busy = true;
    const before = JSON.stringify(data), generation = localGeneration;
    try {
      const row = await getRow();
      if (row && Number(row.revision) !== revision && !dirty && generation === localGeneration && before === JSON.stringify(data)) {
        backup(); install(row.data); revision = Number(row.revision); cache(); paint('Облако · обновлено');
      } else if (!dirty) paint('Облако · сохранено');
    } catch { paint('Без связи · записи в браузере'); }
    finally {busy = false;}
  }
  function download(value, name) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));
    const link = document.createElement('a'); link.href = url; link.download = name; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function close() { dialog?.remove(); dialog = null; }
  function show(errorText = '') {
    close(); dialog = document.createElement('dialog'); dialog.className = 'teacher-cloud-dialog';
    const box = deskEl('div',''); box.append(deskEl('h2','','Облачное хранение'));
    const info = deskEl('p','tiny', user ? 'Записи доступны после входа в твой кабинет. '+message : 'Войди, чтобы хранить уроки в облаке и получать изменения из чата. Без входа кабинет сохраняет записи только в этом браузере.'); box.append(info);
    const error = deskEl('p','tiny',errorText); error.setAttribute('role','alert'); box.append(error);
    if (!user || !ready && !empty) {
      const form = deskEl('form');
      const email = deskEl('input','form-input'), password = deskEl('input','form-input');
      email.type = 'email'; email.required = true; email.autocomplete = 'username'; email.setAttribute('aria-label','Почта для входа'); email.placeholder='Почта'; email.value=user?.email||'';
      password.type='password'; password.required=true; password.autocomplete='current-password'; password.setAttribute('aria-label','Пароль для входа');password.placeholder='Пароль кабинета';
      form.append(email,password);
      const submit = deskEl('button','btn-main','Войти'); submit.type='submit';form.append(submit);
      form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;error.textContent='Входим…';
        try {const {data:auth,error:failure}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(failure)throw failure;password.value='';await connect(auth.session);if(ready||empty)show();else error.textContent=status.title||'Доступ не разрешён.';}
        catch(failure){error.textContent=readable(failure);}finally{submit.disabled=false;}};
      box.append(form,deskEl('p','tiny','Первый вход: создай пользователя в Supabase → Authentication → Users → Add user. Используй свою почту и отдельный пароль для кабинета.'));
    }
    if (user && empty && !ready) box.append(deskButton('Перенести записи из этого браузера',async()=>{
      if(busy)return; backup(); ready=true;dirty=true;revision=0;cache();await flush();show();
    },'btn-main'));
    if (ready && blocked) {
      box.append(deskEl('p','tiny','В облаке есть более новые записи. Твои изменения сохранены в браузере. Сначала скачай их копию, затем загрузи облачную версию.'));
      let exported=false;
      box.append(deskButton('1. Скачать мои изменения',()=>{download(snapshot(),'teacher-desk-local-changes.json');exported=true;load.disabled=false;}));
      const load=deskButton('2. Загрузить записи из облака',async()=>{
        if(!exported||busy)return;
        busy=true;
        try {const row=await getRow();if(!row)throw new Error('Облачная запись не найдена.');backup();install(row.data);revision=Number(row.revision);dirty=false;blocked=false;cache();paint('Облако · сохранено');show();}
        catch(failure){error.textContent=readable(failure);}finally{busy=false;}
      });load.disabled=true;box.append(load);
    } else if (ready) box.append(deskButton('Синхронизировать сейчас',async()=>{await poll(true);show();}));
    box.append(deskButton('Скачать резервную копию',()=>download(snapshot(),'teacher-desk-backup-'+todayISO()+'.json')));
    const previous = (()=>{try{return JSON.parse(localStorage.getItem(BACKUP));}catch{return null;}})();
    if(previous?.data)box.append(deskButton('Скачать копию до загрузки из облака',()=>download(previous.data,'teacher-desk-before-cloud.json')));
    if(user)box.append(deskButton('Выйти из облачного кабинета',async()=>{
      if(dirty){error.textContent='Сначала синхронизируй записи или скачай резервную копию.';return;}
      const {error:failure}=await client.auth.signOut();if(failure){error.textContent=readable(failure);return;}
      user=null;ready=false;empty=false;paint('В этом браузере · войти');show();
    }));
    box.append(deskButton('Закрыть',close));dialog.append(box);document.body.append(dialog);
    dialog.addEventListener('cancel',close);dialog.showModal();
  }
  const oldSave = save;
  save = function(){oldSave();changed();};
  setInterval(()=>poll(),12000);
  window.addEventListener('online',()=>poll(true));
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  // Restoring an expired session is handled by the pinned Supabase client.
  client.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){user=null;ready=false;paint('В этом браузере · войти');}
    if(event==='TOKEN_REFRESHED'&&session)user=session.user;
  });
  paint('В этом браузере · войти');
  client.auth.getSession().then(({data:auth,error})=>{
    if(error)paint('В этом браузере · войти');else if(auth.session)connect(auth.session);
  }).catch(()=>paint('В этом браузере · войти'));
  return {show,flush,poll,connect,changed,getState:()=>({ready,dirty,blocked,empty,revision,message})};
})();

  render();
</script>
</body>
</html>
