<body>
<div id="demoBanner" class="demobanner hidden">Предпросмотр. Результаты сохраняются только в этом браузере, не в Google. <button id="demoSwitch">Сменить роль</button></div>
<div id="root"><div class="loading"><div class="spinner"></div>Открываем WordPet…</div></div>
<div id="toasts" aria-live="polite"></div><div id="dialogs"></div>
<script>
/*__CORE__*/
/*__PRONUNCIATION__*/
/*__DEMO__*/
const PET_ART = /*__PET_ART__*/;
const FOX_ART = PET_ART.fox;
function petType(species){return WordPetCore.petSpecies.find(p=>p.id===species)||WordPetCore.petSpecies[0];}
function petImage(species){return PET_ART[petType(species).id]||FOX_ART;}
const IS_GOOGLE = Boolean(window.google?.script?.run);
const state = {key:'',data:null,page:'home',filter:'all',search:'',session:null,feedback:null,teacherTab:'students',studentId:null,busy:false,assembly:[]};
let audioStatus={};
let audioStore;try{audioStore=globalThis.localStorage;}catch{}
const pronunciation=WordPetAudio.create({store:audioStore,fetchClip:loadAppRecording,onStatus:status=>{audioStatus=status;updateAudioStatus();}});
const icons = {
 paw:'<path d="M7 15c-2 2-1 6 2 5l3-1 3 1c3 1 4-3 2-5l-3-3c-1-1-3-1-4 0Z"/><ellipse cx="5" cy="9" rx="2" ry="2.5"/><ellipse cx="10" cy="5.5" rx="2" ry="2.5"/><ellipse cx="15.5" cy="6" rx="2" ry="2.5"/><ellipse cx="20" cy="10" rx="2" ry="2.5"/>',
 home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',
 book:'<path d="M12 5C8 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 1Zm0 0v15"/>',
 chart:'<path d="M5 20V11m7 9V4m7 16v-7"/>',
 mic:'<rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/>',
 sound:'<path d="m11 5-5 4H2v6h4l5 4Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',
 arrow:'<path d="m9 5 7 7-7 7"/>',
 back:'<path d="m15 5-7 7 7 7"/>',
 food:'<path d="M3 11h18l-3 8H6Z"/><path d="M7 11a5 5 0 0 1 10 0"/>',
 spark:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Zm7 1 1 2 2 1-2 1-1 2-1-2-2-1 2-1Z"/>',
 ball:'<circle cx="12" cy="12" r="9"/><path d="M5 6c8-1 5 13 14 12M5 18c9 0 4-13 14-12"/>',
 edit:'<path d="m15 3 6 6-11 11H4v-6Zm-2 2 6 6"/>',
 check:'<path d="m4 12 5 5L20 6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',
 play:'<path d="m8 4 12 8-12 8Z"/>',
 upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',
 exit:'<path d="M9 4H3v16h6m6-13 5 5-5 5m-6-5h11"/>'
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.paw}</svg>`;
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = value => value ? new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',timeZone:'Asia/Irkutsk'}).format(new Date(String(value).length===10?value+'T12:00:00+08:00':value)) : '—';
const catName = cat => ({hard:'Трудное слово',recent:'С последнего урока',review:'Повторение'})[cat];
function rpc(action,data={}) {
  if (!IS_GOOGLE) return Promise.resolve().then(()=>DemoStore.request(state.key,action,data));
  return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message || 'Не удалось связаться с Google. Попробуй ещё раз.'))).api({key:state.key,action,data}));
}
function toast(message,error=false) {
  const el = document.createElement('div'); el.className='toast'+(error?' error':''); el.textContent=message;
  document.getElementById('toasts').replaceChildren(el); setTimeout(()=>el.remove(),6500);
}
async function busy(fn) {
  if (state.busy) return;
  state.busy=true; const controls=Array.from(document.querySelectorAll('button[type="submit"],button[data-save]')).map(b=>[b,b.disabled]); controls.forEach(([b])=>b.disabled=true);
  try { return await fn(); } catch(e) {toast(e.message,true);} finally {state.busy=false;controls.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled;});}
}
function header() {
  return `<header class="topbar row between wrap"><div class="brand"><span class="brand-mark">${icon('paw')}</span><div>WordPet<small>Маленькая привычка. Большой словарь.</small></div></div><div class="row"><button class="button ghost small" id="audioPreferences">${icon('sound')} Озвучка</button><button class="button ghost" id="logout" aria-label="Выйти">${icon('exit')} Выйти</button></div></header><div class="tiny muted" id="audioStatus" aria-live="polite" style="margin:-14px 0 20px;overflow-wrap:anywhere"></div>`;
}
function nav() {
  return `<nav class="nav" aria-label="Разделы">${[['home','home','Дом'],['words','book','Слова'],['progress','chart','Прогресс']].map(([page,ico,label])=>`<button data-page="${page}" class="${state.page===page?'active':''}" ${state.page===page?'aria-current="page"':''}>${icon(ico)}${label}</button>`).join('')}</nav>`;
}
function render() {
  document.body.classList.toggle('teacher-page',state.data?.role==='teacher');
  if (!state.data) { renderLogin(); return; }
  const body = state.data.role==='teacher' ? teacherPage() : state.page==='study' ? studyPage() : state.page==='lesson' ? lessonPage() : state.page==='words' ? wordsPage() : state.page==='progress' ? progressPage() : homePage();
  document.getElementById('root').innerHTML=`<main class="app">${header()}${body}</main>${state.data.role==='student'&&!['lesson','study'].includes(state.page)?nav():''}`;
  document.getElementById('logout').onclick=logout;
  document.getElementById('audioPreferences').onclick=openAudioPreferences;updateAudioStatus();
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{stopPronunciation();state.assembly=[];state.page=b.dataset.page;render();window.scrollTo(0,0);});
  if (state.data.role==='teacher') bindTeacher(); else bindStudent();

function taskBody(t) {
  const unknown= '<button class="button secondary full" id="unknownAnswer" data-save style="margin-top:12px">Не знаю</button>';
  if(['choose','gap_choice'].includes(t.kind))return `<div class="options">${t.options.map(x=>`<button class="option" data-option="${esc(x)}">${esc(x)}</button>`).join('')}</div>${unknown}`;
  if(t.kind==='letters') {
    const chosen=state.assembly || [];let index=0;
    const answer=Array.from(t.pattern).map(char=>char==='_'?(chosen[index++]===undefined?'＿':t.parts[chosen[index-1]]):char).join('');
    return `<div class="letter-answer" aria-label="Твой ответ" aria-live="polite" style="white-space:pre-wrap;font-size:28px;letter-spacing:3px;padding:18px;border-radius:16px;background:var(--soft);margin-bottom:14px">${esc(answer)}</div><div class="row wrap" style="justify-content:center;gap:10px;margin:18px 0">${t.parts.map((letter,i)=>`<button class="button secondary" data-letter="${i}" aria-label="Буква ${esc(letter)}" style="min-width:44px;min-height:44px;padding:10px" ${chosen.includes(i)?'disabled':''}>${esc(letter)}</button>`).join('')}</div><div class="row" style="justify-content:center;margin-bottom:14px"><button class="button ghost small" id="undoLetter" ${chosen.length?'':'disabled'}>Убрать букву</button><button class="button ghost small" id="resetLetters" ${chosen.length?'':'disabled'}>Сначала</button></div><button class="button full" id="checkLetters" data-save ${chosen.length!==t.parts.length?'disabled':''}>Проверить ${icon('arrow')}</button>${unknown}`;
  }
  if(t.kind==='assemble') {
    const chosen=state.assembly || [];
    return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px;margin-bottom:12px;background:var(--soft);border-radius:15px;text-align:left" class="assembly-answer" aria-label="Твоё предложение"><b>${esc(t.opening)}</b> ${chosen.map((index,pos)=>`<button class="button secondary small" data-remove-part="${pos}" aria-label="Убрать часть ${esc(t.parts[index])}">${esc(t.parts[index])}</button>`).join(' ')}</div><p class="tiny muted">Нажимай на части. Нажми на выбранную часть, чтобы вернуть её.</p><div class="row wrap" style="justify-content:center;margin:18px 0">${t.parts.map((part,index)=>`<button class="button secondary small" data-part="${index}" ${chosen.includes(index)?'disabled':''}>${esc(part)}</button>`).join('')}</div><button class="button full" id="checkAssembly" data-save ${chosen.length!==t.parts.length?'disabled':''}>Проверить ${icon('arrow')}</button>${unknown}`;
  }
  const listen=t.kind==='listen'?`<button class="button secondary full" id="listenWord" style="margin-bottom:14px">${icon('sound')}Послушать</button><button class="button ghost small" id="noAudio" style="margin-bottom:15px">Не слышу — заменить задание</button>`:'';
  return `${listen}<form class="answer-form" id="answerForm"><input class="field" id="typedAnswer" required maxlength="300" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t.kind==='write_ru'?'Перевод':'Твой ответ'}" aria-label="Твой ответ"><button class="button full" type="submit">Проверить${icon('arrow')}</button></form>${unknown}`;
}

 const a=state.data.archive||{items:[]};
 return `<section class="card"><h3>История занятий</h3><p class="subtitle">Тренировки старше 180 дней сохраняются в закрытых архивах Google Drive. Слова, прогресс и питомцы остаются в профилях. Непроверенные ответы остаются в кабинете.</p><p class="tiny muted" style="margin:16px 0">${a.lastOk?'Последняя проверка: '+esc(date(a.lastOk)):'Автоматическая проверка выполняется вместе с обновлением глоссариев каждые 6 часов.'}</p>${a.error?`<p role="alert">Архивирование остановлено: ${esc(a.error)}</p>`:''}<button class="button secondary" id="archiveNow">Проверить архивирование</button><div class="stack" style="margin-top:20px">${a.items.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">Архив ${esc(r.year)} · ${esc(date(r.date))}</a>`).join('')||'<p class="muted">Архивов пока нет.</p>'}</div><p class="footer-note">Архивы доступны владельцу Google Drive. Это файлы JSON.gz: их можно скачать для восстановления истории. Проверенные старые предложения хранятся внутри этих файлов.</p></section>`;
}
function teacherAccess() {
  return `<section class="card"><h3>Каждому — своя ссылка</h3><p class="subtitle">Ученик видит только свои слова, питомца и результаты. Ссылка преподавателя открывает весь кабинет.</p><div style="margin-top:15px">${state.data.access.map(a=>`<div class="access-row"><b>${a.role==='teacher'?'Ты':esc(state.data.students.find(s=>s.id===a.personId)?.name||a.personId)}</b><input class="field" readonly aria-label="Личная ссылка" value="${esc(a.link||'Появится после публикации и обновления ссылок')}"><div class="row"><button class="button secondary small" data-copy="${esc(a.link)}">Копировать</button>${a.role==='student'?`<button class="button ghost small" data-rotate="${esc(a.personId)}">Заменить</button>`:''}</div></div>`).join('')}</div><p class="footer-note">Личные ссылки содержат ключ доступа. Передавай каждую только её владельцу. Кнопка «Заменить» отключает старую ссылку ученика.</p></section>`;

function bindStudent() {
  document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));
  document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>busy(async()=>{state.data.pet=await rpc('care',{kind:b.dataset.care});render();document.getElementById('petRoom')?.classList.add('animate-care');toast(b.dataset.care==='feed'?'Питомец накормлен!':b.dataset.care==='clean'?'В комнате чисто!':'У питомца появился мячик!');}));
  document.getElementById('renamePet')?.addEventListener('click',()=>renamePet());
  document.getElementById('choosePet')?.addEventListener('click',openPetPicker);
  document.getElementById('startMission')?.addEventListener('click',()=>startMission(false));
  document.getElementById('retryMission')?.addEventListener('click',()=>startMission(true));
  document.getElementById('beginExercises')?.addEventListener('click',()=>{stopPronunciation();state.page='lesson';render();window.scrollTo(0,0);document.getElementById('typedAnswer')?.focus();});
  document.getElementById('backHome')?.addEventListener('click',()=>busy(async()=>{stopPronunciation();await reload();state.page='home';state.session=null;render();}));
  document.getElementById('leaveLesson')?.addEventListener('click',()=>busy(async()=>{stopPronunciation();state.assembly=[];await reload();state.page='home';state.feedback=null;render();}));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render();});
  document.getElementById('wordSearch')?.addEventListener('input',e=>{state.search=e.target.value;const position=e.target.selectionStart;render();const el=document.getElementById('wordSearch');el.focus();el.setSelectionRange(position,position);});
  document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>submitAnswer(b.dataset.option));
  document.getElementById('answerForm')?.addEventListener('submit',e=>{e.preventDefault();submitAnswer(document.getElementById('typedAnswer').value);});
  document.getElementById('unknownAnswer')?.addEventListener('click',()=>submitAnswer('',{unknown:true}));
  document.getElementById('listenWord')?.addEventListener('click',()=>speak(state.session.task.speak));
  document.getElementById('noAudio')?.addEventListener('click',()=>busy(async()=>{stopPronunciation();state.session=await rpc('noAudio',{sessionId:state.session.id});render();}));
  document.getElementById('nextTask')?.addEventListener('click',()=>{stopPronunciation();state.feedback=null;state.assembly=[];render();document.getElementById('typedAnswer')?.focus();});
  document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(!state.assembly.includes(Number(b.dataset.letter)))state.assembly.push(Number(b.dataset.letter));render();});
  document.getElementById('undoLetter')?.addEventListener('click',()=>{state.assembly.pop();render();});
  document.getElementById('resetLetters')?.addEventListener('click',()=>{state.assembly=[];render();});
  document.getElementById('checkLetters')?.addEventListener('click',()=>{const t=state.session.task;let i=0;submitAnswer(Array.from(t.pattern).map(char=>char==='_'?t.parts[state.assembly[i++]]:char).join(''));});
  document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{state.assembly.push(Number(b.dataset.part));render();});
  document.querySelectorAll('[data-remove-part]').forEach(b=>b.onclick=()=>{state.assembly.splice(Number(b.dataset.removePart),1);render();});
  document.getElementById('checkAssembly')?.addEventListener('click',()=>{const t=state.session.task;submitAnswer([t.opening,...state.assembly.map(i=>t.parts[i])].join(' '));});
}
async function startMission(retry) {
  return busy(async()=>{stopPronunciation();const session=await rpc('start',{retry});void pronunciation.preload(session.studyWords || []);state.assembly=[];state.session=session;state.feedback=null;state.page=session.status==='completed'?'lesson':'study';render();window.scrollTo(0,0);});
}
async function submitAnswer(answer,extra={}) {
  return busy(async()=>{
    stopPronunciation();const task=state.session.task;
    const result=await rpc('answer',{sessionId:state.session.id,taskId:task.id,answer,...extra});
    state.session=result.session;state.data.pet=result.pet;state.feedback={result:result.result,task};state.assembly=[];render();
  });
}
function updateAudioStatus() {
  const el=document.getElementById('audioStatus');if(!el)return;
  el.innerHTML=esc(audioStatus.message || '')+(audioStatus.source?` · <a href="${esc(audioStatus.source)}" target="_blank" rel="noopener noreferrer">Источник записи</a>`:'')+(audioStatus.license?` · <a href="${esc(audioStatus.license)}" target="_blank" rel="noopener noreferrer">${esc(audioStatus.licenseName || 'Лицензия')}</a>`:'');
}
function stopPronunciation(){pronunciation.stop();audioStatus={};updateAudioStatus();}
function speak(text){void pronunciation.speak(text);}
function loadAppRecording(text){
  const normalized=WordPetAudio.clean(text);
  if(normalized===WordPetAudio.SAMPLE)return rpc('speech',{kind:'sample'});
  const words=[...(state.session?.studyWords || []),...(state.data?.words || []),...(state.data?.students || []).flatMap(s=>s.words || [])];
  const word=words.find(w=>WordPetAudio.clean(w.english)===normalized);
  if(word)return rpc('speech',{kind:'word',wordId:word.id,text:normalized});
  const example=words.find(w=>WordPetAudio.clean(w.example)===normalized);
  if(example)return rpc('speech',{kind:'example',wordId:example.id,text:normalized});
  return Promise.resolve({ready:false});
}
async function openAudioPreferences(){
  const prefs=pronunciation.preferences();
  dialog(`<h2>Британская озвучка</h2><p class="subtitle">Слова, выражения и примеры звучат одним нейроголосом Emma. Записи проигрываются прямо в игре.</p><form id="audioForm"><label class="field-label">Скорость<select class="field" id="audioRate">${[[0.9,'Медленнее'],[1,'Обычная'],[1.1,'Быстрее']].map(([rate,label])=>`<option value="${rate}" ${Math.abs(prefs.rate-rate)<0.04?'selected':''}>${label}</option>`).join('')}</select></label><button class="button secondary full" type="button" id="testAudioVoice">${icon('sound')}Послушать пример голоса</button><p class="tiny muted" id="voiceTestStatus" aria-live="polite"></p><button class="button full" type="submit">Сохранить</button><p class="footer-note">Для новых слов запись готовится отдельно. Пока она готовится, задание на слух можно заменить.</p></form>`);
  document.getElementById('testAudioVoice').onclick=async()=>{
    const old=pronunciation.preferences();pronunciation.updatePreferences({rate:document.getElementById('audioRate').value});
    try{const success=await pronunciation.speak(WordPetAudio.SAMPLE);const el=document.getElementById('voiceTestStatus');if(el)el.textContent=success?'Это голос для слов и предложений в игре.':'Запись пока не загрузилась. Попробуй ещё раз.';}
    finally{pronunciation.updatePreferences(old);}
  };
  document.getElementById('audioForm').onsubmit=e=>{e.preventDefault();const rate=document.getElementById('audioRate').value;stopPronunciation();pronunciation.updatePreferences({rate});closeDialog();toast('Скорость озвучки сохранена.');};
}
function openPetPicker() {
  const current=state.data.pet;
  dialog(`<h2>Кто будет учиться с тобой?</h2><p class="subtitle">Выбери напарника и придумай ему имя. Можно менять питомца — опыт, монеты, корм и мячик сохранятся.</p><form id="petForm"><fieldset class="pet-choices"><legend class="visually-hidden">Выбери питомца</legend>${WordPetCore.petSpecies.map(p=>`<label class="pet-option"><input type="radio" name="petSpecies" value="${p.id}" ${petType(current.species).id===p.id?'checked':''} required><img src="${petImage(p.id)}" alt=""><span class="pet-option-copy"><strong>${esc(p.label)}</strong><span>${esc(p.description)}</span></span></label>`).join('')}</fieldset><label class="field-label">Имя питомца<input class="field" id="chosenPetName" minlength="2" maxlength="20" value="${esc(current.name)}" required autocomplete="off"></label><button class="button full" type="submit" style="margin-top:18px">Сохранить питомца ${icon('paw')}</button><p class="footer-note">Выбор сохранится в твоём профиле.</p></form>`,true);
  document.getElementById('petForm').onsubmit=e=>{e.preventDefault();busy(async()=>{
    const selected=document.querySelector('input[name="petSpecies"]:checked');
    if(!selected)throw Error('Выбери питомца.');
    const pet=await rpc('savePet',{name:document.getElementById('chosenPetName').value,species:selected.value});
    state.data.pet=pet;closeDialog();render();toast('Питомец сохранён!');
  });};
}
function renamePet() {
  dialog(`<h2>Как зовут питомца?</h2><form id="renameForm"><label class="field-label">Имя<input class="field" id="petName" minlength="2" maxlength="20" value="${esc(state.data.pet.name)}" required></label><button class="button" type="submit">Сохранить</button></form>`);
  document.getElementById('renameForm').onsubmit=e=>{e.preventDefault();busy(async()=>{state.data.pet=await rpc('savePet',{name:document.getElementById('petName').value});closeDialog();render();});};
}
function bindTeacher(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.teacherTab=b.dataset.tab;render();});
  document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{state.studentId=b.dataset.student;state.teacherTab='words';render();});
  document.getElementById('teacherStudent')?.addEventListener('change',e=>{state.studentId=e.target.value;render();});
  document.getElementById('syncNow')?.addEventListener('click',()=>busy(async()=>{const result=await rpc('sync');await reload();render();toast(result.some(r=>!r.ok)?'Часть глоссариев не обновилась. Смотри статус ученика.':'Глоссарии обновлены.');}));
  document.getElementById('addWord')?.addEventListener('click',()=>wordDialog());
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wordDialog(state.data.students.flatMap(s=>s.words).find(w=>w.id===b.dataset.edit)));
  document.querySelectorAll('[data-hard]').forEach(b=>b.onclick=()=>busy(async()=>{await rpc('markHard',{wordId:b.dataset.hard});await reload();render();toast('Слово отмечено как трудное сегодня.');}));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
  document.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=()=>{if(confirm('Заменить личную ссылку? Старая перестанет работать.'))busy(async()=>{await rpc('rotateKey',{studentId:b.dataset.rotate});await reload();render();toast('Новая ссылка готова.');});});
  document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>busy(async()=>{const result=await rpc('audio',{answerId:b.dataset.audio});const player=document.createElement('audio');player.controls=true;player.className='audio-player';player.src=`data:${result.mime};base64,${result.audio}`;b.closest('article').querySelector('[data-audio-player]').replaceChildren(player);b.classList.add('hidden');}));
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>busy(async()=>{const card=b.closest('[data-review-id]');await rpc('review',{answerId:card.dataset.reviewId,correct:b.dataset.review==='yes',feedback:card.querySelector('textarea').value});await reload();render();toast('Проверка сохранена.');}));
}
function wordDialog(word){
  const s=state.data.students.find(s=>s.id===(state.studentId||state.data.students[0].id));
  dialog(`<h2>${word?'Изменить слово':'Добавить слово'}</h2><p class="subtitle">${esc(s.name)} · слово сохраняется в приложении. Подключённый глоссарий остаётся источником остальных слов.</p><form id="wordForm"><label class="field-label">Слово или выражение<input class="field" id="newEnglish" value="${esc(word?.english||'')}" required maxlength="160" ${word?'readonly':''}></label><label class="field-label">Перевод<input class="field" id="newRussian" value="${esc(word?.russian||'')}" required maxlength="300"></label><label class="field-label">Пример для пропуска и сборки предложения<input class="field" id="newExample" value="${esc(word?.example||'')}" maxlength="500" placeholder="I occasionally go swimming."></label><label class="field-label">Перевод примера<input class="field" id="newExampleRu" value="${esc(word?.exampleRu||'')}" maxlength="500" placeholder="Русский перевод предложения"></label><label class="field-label">Как использовать слово<input class="field" id="newUsage" value="${esc(word?.usage||'')}" maxlength="500" placeholder="Например: be keen on + существительное / -ing"></label><label class="field-label">Другие допустимые формы английского слова<input class="field" id="newAnswers" value="${esc(word?.answers||'')}" placeholder="am keen on | is keen on | are keen on"></label><label class="field-label">Допустимые русские переводы<input class="field" id="newAliases" value="${esc(word?.russianAliases||'')}" placeholder="изредка | иногда | время от времени"></label><label class="check-label"><input type="checkbox" id="newHard" ${!word?'checked':''}>Возникли трудности на сегодняшнем уроке</label><button class="button" type="submit">Сохранить слово</button></form>`);
  document.getElementById('wordForm').onsubmit=e=>{e.preventDefault();busy(async()=>{await rpc('addWord',{studentId:s.id,english:document.getElementById('newEnglish').value,russian:document.getElementById('newRussian').value,example:document.getElementById('newExample').value,exampleRu:document.getElementById('newExampleRu').value,usage:document.getElementById('newUsage').value,answers:document.getElementById('newAnswers').value,russianAliases:document.getElementById('newAliases').value,hard:document.getElementById('newHard').checked});closeDialog();await reload();render();toast('Слово сохранено.');});};
}
function dialog(html,wide=false){document.getElementById('dialogs').innerHTML=`<div class="dialog-backdrop"><section class="dialog ${wide?'dialog-wide':''}" role="dialog" aria-modal="true"><div class="row between"><span class="label">WordPet</span><button class="button ghost small" id="closeDialog" aria-label="Закрыть">Закрыть</button></div><div style="margin-top:14px">${html}</div></section></div>`;document.getElementById('closeDialog').onclick=closeDialog;setTimeout(()=>document.querySelector('.dialog input')?.focus(),50);}
function closeDialog(){document.getElementById('dialogs').replaceChildren();}
async function copyText(text){if(!text){toast('Сначала опубликуй приложение и обнови ссылки.',true);return;}try{await navigator.clipboard.writeText(text);toast('Скопировано.');}catch{dialog(`<h3>Скопируй ссылку</h3><textarea class="field" readonly style="margin-top:15px">${esc(text)}</textarea>`);document.querySelector('.dialog textarea').select();}}
async function reload(){state.data=await rpc('bootstrap');}
function renderLogin(){
  document.getElementById('root').innerHTML=`<main class="app"><section class="login"><div class="brand" style="margin-bottom:24px"><span class="brand-mark">${icon('paw')}</span>WordPet</div><div class="pet-room"><img src="${FOX_ART}" alt="Лисёнок ждёт в своей комнате"></div><h1>Твой питомец.<br>Твои новые слова.</h1><p class="muted">Открой личную ссылку от преподавателя или вставь код доступа.</p><form id="loginForm"><label class="visually-hidden" for="accessKey">Код доступа</label><input class="field" id="accessKey" type="password" autocomplete="off" placeholder="Личный код доступа" required><button class="button full" type="submit">Войти ${icon('arrow')}</button></form><p class="footer-note">Каждый ученик видит только свои слова и результаты.</p></section></main>`;
  document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();connect(document.getElementById('accessKey').value.trim());};

}
async function connect(key){return busy(async()=>{if(state.key!==key){pronunciation.clear();state.session=null;state.feedback=null;}state.key=key;try{await reload();}catch(e){state.data=null;renderLogin();throw e;}try{localStorage.setItem('wordpet-key',key);}catch{}state.page='home';render();});}
function logout(){pronunciation.clear();stopPronunciation();state.assembly=[];state.data=null;state.key='';state.session=null;state.feedback=null;try{localStorage.removeItem('wordpet-key');}catch{}renderLogin();}

async function boot(){
  if(!IS_GOOGLE){document.getElementById('demoBanner').classList.remove('hidden');document.getElementById('demoSwitch').onclick=chooseDemo;}
  let saved='';try{saved=localStorage.getItem('wordpet-key')||'';}catch{}
  if(IS_GOOGLE){google.script.url.getLocation(location=>{const params=new URLSearchParams(location.hash||'');const key=params.get('key')||saved;if(key&&!key.startsWith('demo-'))connect(key);else renderLogin();});}
  else {const key=new URLSearchParams(window.location.hash.slice(1)).get('key')||saved;if(key.startsWith('demo-'))connect(key);else {renderLogin();chooseDemo();}}
}
boot();
</script>
